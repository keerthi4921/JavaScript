<!DOCTYPE html>
<html>
<head>
    
    <title>Form</title>
    <style>
        input{
            display:block;
            width:300px;
            height: 50px;
            border-radius: 10px;
            font-size: large;
            background-color: blueviolet;
        }
        body{
            background: linear-gradient(to left,rgb(197, 27, 223),rgb(245, 95, 240)) ;
        }
        button{
            width:30%;
            height:30%;
            background-color:rgb(112, 17, 117) ;
            color: whitesmoke;
            border-radius: 10px;
            font-size: large;
        }
        ::placeholder{
            font-size:large;
            padding-left: 30px;
            color:white;

        }
        
        div{
            background-color: rgb(246, 94, 233);
            width: 30%;
            padding-left: 30px;
            margin-left: 700px;
            margin-top: 150px;
            font-size: x-large;
        }
        .Box{
            width:300px;
            height:300px;
            margin-right: 200px;
            margin-left:250px;
            margin-top: -300px;
        

            background-color: rgb(251, 112, 212);
            
        }
        .Box img{
            width:300px;
            border-radius: 50px;
        }
        h1{
            color:rgb(57, 3, 66);
            text-shadow: 50px;
        }
    
    </style>
</head>
<body>
    <div>
        <h1>Login Here</h1>
        <form>
            <input type="text" placeholder="Enter name">
            <br><br>
            <input type="number"placeholder="Enter number">
            <br><br>
            <input type="email" placeholder="Enter mail">
            <br><br>
            <button>Login</button>
            <br><br>
        </form>
    </div>
    <div class="Box">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQZTc-M20lNwVH3uIvbDR7BOgOvMdaEClxkvqU5PhReWg&s=10" alt="Image">

    </div>

</html>
